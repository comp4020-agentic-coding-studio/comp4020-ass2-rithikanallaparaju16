<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <!-- Policies and support: a bench with two people on it, one turned towards
       the other. Chosen deliberately — the strongest evidence on this
       syllabus for anything helping is Chibanda's Friendship Bench, where the
       intervention was six conversations on a wooden bench outdoors. A page
       about where to get help should look like that rather than like a form.
       The ring at the right is the same motif as the other banners, and here
       it is nearly closed. -->
  <defs>
    <linearGradient id="polSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15110e"/>
      <stop offset="1" stop-color="#291f14"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#polSky)"/>

  <!-- the ring, closing: a longer arc than the homepage version, with the gap
       almost shut. This is the one page where something is resolved. -->
  <path d="M1352 178a112 112 0 1 1-24 172" fill="none" stroke="#b97d1c" stroke-width="13"
        stroke-linecap="round" opacity="0.42"/>

  <!-- ground, two plates -->
  <path d="M0 500c300-30 600-18 900 2s400 22 700-8v206H0Z" fill="#8a5c13" opacity="0.44"/>
  <path d="M0 518c300-30 600-18 900 2s400 22 700-8v188H0Z" fill="#b97d1c" opacity="0.26"/>

  <!-- the bench: slats and legs, plain -->
  <g transform="translate(500 400)">
    <g style="mix-blend-mode:screen" opacity="0.4" transform="translate(7 -5)">
      <rect x="0" y="96" width="600" height="20" rx="6" fill="#b97d1c"/>
    </g>
    <!-- back rail -->
    <rect x="20" y="26" width="560" height="16" rx="6" fill="#6b6154" opacity="0.85"/>
    <rect x="20" y="54" width="560" height="14" rx="6" fill="#6b6154" opacity="0.7"/>
    <!-- seat -->
    <rect x="0" y="96" width="600" height="20" rx="6" fill="#8a5c13"/>
    <rect x="0" y="120" width="600" height="12" rx="5" fill="#6b6154" opacity="0.6"/>
    <!-- legs and back posts -->
    <rect x="36" y="116" width="16" height="98" fill="#6b6154" opacity="0.8"/>
    <rect x="548" y="116" width="16" height="98" fill="#6b6154" opacity="0.8"/>
    <rect x="36" y="18" width="14" height="86" fill="#6b6154" opacity="0.8"/>
    <rect x="550" y="18" width="14" height="86" fill="#6b6154" opacity="0.8"/>
  </g>

  <!-- the listener, turned towards the other. Older, calm, closed eyes: the
       Friendship Bench was staffed by grandmothers. -->
  <g transform="translate(660 356)">
    <path d="M-50 148c0-46 22-80 50-80s50 34 50 80Z" fill="#14110e"/>
    <circle cx="0" cy="0" r="37" fill="#f3ece0"/>
    <path d="M0-40c24 0 38 16 38 40 0 5-2 8-4 8-2 0-1-10-6-16-5-7-15-10-28-10s-23 3-28 10c-5 6-4 16-6 16-2 0-4-3-4-8 0-24 14-40 38-40Z" fill="#6b6154"/>
    <path d="M-19 -2c4-5 11-5 15 0M4 -2c4-5 11-5 15 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M-14 18c6 7 22 7 28 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-26" cy="9" rx="10" ry="6" fill="#b97d1c" opacity="0.35"/>
    <ellipse cx="26" cy="9" rx="10" ry="6" fill="#b97d1c" opacity="0.35"/>
  </g>

  <!-- the one doing the talking, leaning slightly in -->
  <g transform="translate(900 366) rotate(-5)">
    <path d="M-48 142c0-44 21-76 48-76s48 32 48 76Z" fill="#14110e"/>
    <circle cx="0" cy="0" r="35" fill="#f3ece0"/>
    <path d="M0-38c23 0 36 15 36 38 0 4-2 7-4 7-2 0-1-10-5-15-5-7-14-10-27-10s-22 3-27 10c-4 5-3 15-5 15-2 0-4-3-4-7 0-23 13-38 36-38Z" fill="#1a1613"/>
    <path d="M-18 -2c4-5 10-5 14 0M4 -2c4-5 10-5 14 0" stroke="#1a1613" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- mid-sentence -->
    <ellipse cx="0" cy="17" rx="9" ry="7" fill="#1a1613"/>
  </g>

  <!-- a small tree behind the bench, off to the left -->
  <g style="mix-blend-mode:screen">
    <ellipse cx="238" cy="288" rx="118" ry="84" fill="#8a5c13" opacity="0.36"/>
    <ellipse cx="250" cy="280" rx="118" ry="84" fill="#b97d1c" opacity="0.2"/>
  </g>
  <rect x="230" y="362" width="14" height="140" fill="#6b6154" opacity="0.55"/>
</svg>
