<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <!-- Crits: the room listening. One person is talking, the rest are turned
       towards them — two writing, the others just attending, all of them warm
       about it. The arc is deliberate: a crit is a circle, not rows facing a
       front, which is the whole difference between this and a lecture. -->
  <defs>
    <linearGradient id="critSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16120f"/>
      <stop offset="1" stop-color="#261d13"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#critSky)"/>

  <!-- the ground they are sitting on, two plates out of register -->
  <path d="M0 470c300-34 600-22 900-2s400 26 700-6v238H0Z" fill="#8a5c13" opacity="0.46"/>
  <path d="M0 488c300-34 600-22 900-2s400 26 700-6v220H0Z" fill="#b97d1c" opacity="0.28"/>

  <!-- the speaker: standing out of the arc, gold rather than dark, one arm up.
       Nobody is looking at a slide because there isn't one. -->
  <g transform="translate(806 318)">
    <g style="mix-blend-mode:screen" opacity="0.6" transform="translate(7 -6)">
      <circle cx="0" cy="0" r="41" fill="#b97d1c"/>
      <path d="M-58 148c0-50 26-88 58-88s58 38 58 88Z" fill="#b97d1c"/>
    </g>
    <!-- Body kept near-black like everyone else's: an earlier pass made it
         bronze and it vanished into the bronze ground. What marks the speaker
         is that they are standing, mid-word, with a hand up. -->
    <path d="M-55 148c0-48 25-84 55-84s55 36 55 84Z" fill="#14110e"/>
    <circle cx="0" cy="0" r="38" fill="#f3ece0"/>
    <!-- open mouth: the only open mouth in the picture -->
    <ellipse cx="0" cy="16" rx="11" ry="9" fill="#16120f"/>
    <path d="M-19 -6c5-6 14-6 19 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M2 -6c5-6 14-6 19 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- a hand, mid-gesture -->
    <path d="M52 82c22-14 34-38 30-62" stroke="#b97d1c" stroke-width="15" fill="none" stroke-linecap="round"/>
  </g>

  <!-- the arc of listeners. Faces carry a closed, warm smile; two hold
       notebooks and look down at them instead. -->
  <g>
    <!-- far left, listening -->
    <g transform="translate(196 468)">
      <circle cx="0" cy="0" r="34" fill="#f3ece0"/>
      <path d="M-50 124c0-40 22-70 50-70s50 30 50 70Z" fill="#14110e"/>
      <path d="M-17 -4c4-5 12-5 16 0M1 -4c4-5 12-5 16 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-14 16c6 7 22 7 28 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-24" cy="8" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
      <ellipse cx="24" cy="8" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
    </g>

    <!-- taking notes: head tilted down, notebook on the lap -->
    <g transform="translate(392 430)">
      <circle cx="0" cy="4" r="32" fill="#f3ece0"/>
      <path d="M-47 118c0-38 21-66 47-66s47 28 47 66Z" fill="#14110e"/>
      <path d="M-16 6c4-4 11-4 15 0M2 6c4-4 11-4 15 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-11 24c5 5 18 5 23 0" stroke="#16120f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="-30" y="86" width="60" height="40" rx="4" fill="#f3ece0" opacity="0.92" transform="rotate(-7)"/>
      <g stroke="#6b6154" stroke-width="3" opacity="0.7" transform="rotate(-7)">
        <path d="M-22 98h44M-22 108h34M-22 118h40"/>
      </g>
    </g>

    <!-- listening, nearest the speaker -->
    <g transform="translate(596 392)">
      <circle cx="0" cy="0" r="34" fill="#f3ece0"/>
      <path d="M-50 122c0-40 22-70 50-70s50 30 50 70Z" fill="#14110e"/>
      <path d="M-17 -4c4-5 12-5 16 0M1 -4c4-5 12-5 16 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-15 16c6 8 24 8 30 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-24" cy="8" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
      <ellipse cx="24" cy="8" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
    </g>

    <!-- other side of the arc, listening -->
    <g transform="translate(1018 394)">
      <circle cx="0" cy="0" r="33" fill="#f3ece0"/>
      <path d="M-49 120c0-39 22-68 49-68s49 29 49 68Z" fill="#14110e"/>
      <path d="M-16 -4c4-5 11-5 15 0M1 -4c4-5 11-5 15 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-14 15c6 7 22 7 28 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-23" cy="7" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
      <ellipse cx="23" cy="7" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
    </g>

    <!-- second note-taker -->
    <g transform="translate(1214 432)">
      <circle cx="0" cy="4" r="31" fill="#f3ece0"/>
      <path d="M-46 116c0-37 21-64 46-64s46 27 46 64Z" fill="#14110e"/>
      <path d="M-15 6c4-4 11-4 15 0M2 6c4-4 11-4 15 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-10 23c5 5 17 5 22 0" stroke="#16120f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="-29" y="84" width="58" height="38" rx="4" fill="#f3ece0" opacity="0.92" transform="rotate(6)"/>
      <g stroke="#6b6154" stroke-width="3" opacity="0.7" transform="rotate(6)">
        <path d="M-21 96h42M-21 106h30M-21 116h37"/>
      </g>
    </g>

    <!-- far right, half turned away, still in the circle -->
    <g transform="translate(1410 470)">
      <circle cx="0" cy="0" r="32" fill="#f3ece0"/>
      <path d="M-47 118c0-38 21-66 47-66s47 28 47 66Z" fill="#14110e"/>
      <path d="M2 -4c4-5 11-5 15 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-8 16c6 7 20 7 26 0" stroke="#16120f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="26" cy="7" rx="9" ry="5" fill="#b97d1c" opacity="0.4"/>
    </g>
  </g>
</svg>
