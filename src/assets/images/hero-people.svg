<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <!-- People: a tutor teaching a cohort, outdoors, standing while the group
       sits. The teacher carries the same calm closed-eyed smile as the three
       portraits on the page below, so the banner and the cards read as one
       set. No lectern, no screen — there is nothing here but a person talking
       to a group on some grass. -->
  <defs>
    <linearGradient id="pplSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15110e"/>
      <stop offset="1" stop-color="#271e14"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#pplSky)"/>

  <!-- a tree at the edge of frame, for the outdoors -->
  <g style="mix-blend-mode:screen">
    <ellipse cx="316" cy="188" rx="150" ry="104" fill="#8a5c13" opacity="0.4"/>
    <ellipse cx="330" cy="178" rx="150" ry="104" fill="#b97d1c" opacity="0.22"/>
  </g>
  <rect x="308" y="278" width="16" height="176" fill="#6b6154" opacity="0.6"/>

  <!-- ground, two plates -->
  <path d="M0 486c320-32 640-20 950 0s330 24 650-8v222H0Z" fill="#8a5c13" opacity="0.46"/>
  <path d="M0 504c320-32 640-20 950 0s330 24 650-8v204H0Z" fill="#b97d1c" opacity="0.27"/>

  <!-- the teacher: standing, mid-sentence, one hand open -->
  <g transform="translate(668 250)">
    <g style="mix-blend-mode:screen" opacity="0.5" transform="translate(8 -6)">
      <circle cx="0" cy="0" r="44" fill="#b97d1c"/>
      <path d="M-62 250c0-96 28-172 62-172s62 76 62 172Z" fill="#b97d1c"/>
    </g>
    <!-- body first, then head on top -->
    <path d="M-58 250c0-94 26-168 58-168s58 74 58 168Z" fill="#8a5c13"/>
    <circle cx="0" cy="0" r="42" fill="#f3ece0"/>
    <!-- hair mass -->
    <path d="M0-44c26 0 42 18 42 44 0 5-2 8-4 8-2 0-1-11-6-18-5-8-16-11-32-11s-27 3-32 11c-5 7-4 18-6 18-2 0-4-3-4-8 0-26 16-44 42-44Z" fill="#1a1613"/>
    <!-- the same calm face as the portraits -->
    <path d="M-21 -2c4-5 12-5 16 0M5 -2c4-5 12-5 16 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M-16 20c6 8 26 8 32 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-29" cy="10" rx="11" ry="6" fill="#b97d1c" opacity="0.35"/>
    <ellipse cx="29" cy="10" rx="11" ry="6" fill="#b97d1c" opacity="0.35"/>
    <!-- open hand, the only gesture in the picture -->
    <path d="M56 158c30-10 50-34 54-62" stroke="#8a5c13" stroke-width="17" fill="none" stroke-linecap="round"/>
  </g>

  <!-- the cohort: seven seated, all turned towards the teacher, two rows so
       the group has depth. Back row smaller and dimmer. -->
  <g fill="#14110e">
    <g opacity="0.55">
      <g transform="translate(1046 366)"><circle cx="0" cy="0" r="25"/><path d="M-37 92c0-30 17-52 37-52s37 22 37 52Z"/></g>
      <g transform="translate(1168 358)"><circle cx="0" cy="0" r="24"/><path d="M-36 88c0-29 16-50 36-50s36 21 36 50Z"/></g>
      <g transform="translate(1288 370)"><circle cx="0" cy="0" r="25"/><path d="M-37 92c0-30 17-52 37-52s37 22 37 52Z"/></g>
    </g>
    <g transform="translate(986 420)"><circle cx="0" cy="0" r="31"/><path d="M-46 114c0-37 21-64 46-64s46 27 46 64Z"/></g>
    <g transform="translate(1118 434)"><circle cx="0" cy="0" r="29"/><path d="M-43 108c0-35 19-60 43-60s43 25 43 60Z"/></g>
    <g transform="translate(1250 424)"><circle cx="0" cy="0" r="32"/><path d="M-47 116c0-38 21-66 47-66s47 28 47 66Z"/></g>
    <g transform="translate(1386 438)"><circle cx="0" cy="0" r="28"/><path d="M-42 104c0-34 19-58 42-58s42 24 42 58Z"/></g>
  </g>

  <!-- one notebook in the front row, angled up -->
  <g transform="translate(1120 508) rotate(-8)">
    <rect x="-28" y="0" width="56" height="34" rx="4" fill="#f3ece0" opacity="0.85"/>
    <g stroke="#6b6154" stroke-width="2.5" opacity="0.6">
      <path d="M-20 10h40M-20 19h30"/>
    </g>
  </g>
</svg>
