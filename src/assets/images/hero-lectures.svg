<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <!-- Lectures: a tree letting go of its leaves into a crosswind. The lectures
       are held outdoors and the leaves run left to right off the frame, which
       is the closest a still image gets to the feeling the course is after —
       something moving through you rather than being held onto. -->
  <defs>
    <linearGradient id="lecSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110e"/>
      <stop offset="1" stop-color="#241c12"/>
    </linearGradient>
    <!-- one leaf, reused at many sizes and angles -->
    <path id="leaf" d="M0 0c11-7 25-6 33 2-8 8-22 9-33-2Z"/>
  </defs>

  <rect width="1600" height="700" fill="url(#lecSky)"/>

  <!-- Trunk and boughs go down FIRST so the canopy covers where they end.
       Drawn over the top they read as scaffolding through the leaves. -->
  <g fill="none" stroke="#6b6154" stroke-linecap="round" opacity="0.85">
    <path d="M318 700c-4-130 6-236 26-320" stroke-width="26"/>
    <path d="M344 372c-30-40-46-84-48-124" stroke-width="14"/>
    <path d="M344 372c34-34 62-76 74-118" stroke-width="14"/>
    <path d="M330 460c-36-22-62-52-76-86" stroke-width="11"/>
    <path d="M336 430c38-16 70-42 90-74" stroke-width="11"/>
  </g>

  <!-- Canopy in two plates. The base plate is opaque and unblended: with
       mix-blend-mode:screen on it the pale branches beneath showed straight
       through the leaves. Only the offset plate blends. -->
  <g fill="#8a5c13">
    <ellipse cx="300" cy="236" rx="176" ry="122"/>
    <ellipse cx="430" cy="286" rx="104" ry="74"/>
  </g>
  <g style="mix-blend-mode:screen" fill="#b97d1c" opacity="0.38" transform="translate(14 -10)">
    <ellipse cx="300" cy="236" rx="176" ry="122"/>
  </g>

  <!-- the wind: leaves streaming off to the right, thinning as they go, each
       tilted a little differently so the stream does not read as a pattern -->
  <g fill="#b97d1c">
    <g opacity="0.9"><use href="#leaf" transform="translate(492 232) rotate(-14) scale(1.5)"/></g>
    <g opacity="0.85"><use href="#leaf" transform="translate(560 196) rotate(8) scale(1.3)"/></g>
    <g opacity="0.8"><use href="#leaf" transform="translate(614 268) rotate(-26) scale(1.45)"/></g>
    <g opacity="0.78"><use href="#leaf" transform="translate(690 214) rotate(16) scale(1.2)"/></g>
    <g opacity="0.72"><use href="#leaf" transform="translate(742 300) rotate(-8) scale(1.35)"/></g>
    <g opacity="0.68"><use href="#leaf" transform="translate(818 240) rotate(28) scale(1.15)"/></g>
    <g opacity="0.62"><use href="#leaf" transform="translate(892 188) rotate(-18) scale(1.3)"/></g>
    <g opacity="0.58"><use href="#leaf" transform="translate(946 320) rotate(12) scale(1.1)"/></g>
    <g opacity="0.52"><use href="#leaf" transform="translate(1024 258) rotate(-30) scale(1.25)"/></g>
    <g opacity="0.46"><use href="#leaf" transform="translate(1108 206) rotate(6) scale(1.05)"/></g>
    <g opacity="0.4"><use href="#leaf" transform="translate(1164 334) rotate(-12) scale(1.2)"/></g>
    <g opacity="0.34"><use href="#leaf" transform="translate(1256 272) rotate(22) scale(1)"/></g>
    <g opacity="0.28"><use href="#leaf" transform="translate(1338 224) rotate(-20) scale(1.1)"/></g>
    <g opacity="0.22"><use href="#leaf" transform="translate(1424 300) rotate(10) scale(0.95)"/></g>
    <g opacity="0.16"><use href="#leaf" transform="translate(1512 254) rotate(-26) scale(1.05)"/></g>
  </g>

  <!-- three long wind lines, barely there -->
  <g fill="none" stroke="#b97d1c" stroke-linecap="round" opacity="0.16">
    <path d="M520 168c220-26 470-14 700-30" stroke-width="4"/>
    <path d="M600 352c220 22 470 8 700-22" stroke-width="3"/>
    <path d="M660 412c200 10 430 2 640-16" stroke-width="2.5"/>
  </g>

  <!-- ground: two plates, the second offset -->
  <path d="M0 512c280-40 560-26 860-4s460 30 740-4v196H0Z" fill="#8a5c13" opacity="0.5"/>
  <path d="M0 528c280-40 560-26 860-4s460 30 740-4v180H0Z" fill="#b97d1c" opacity="0.3"/>

  <!-- a few leaves already down, resting on the grass -->
  <g fill="#14110e" opacity="0.55">
    <use href="#leaf" transform="translate(430 566) rotate(6) scale(1.2)"/>
    <use href="#leaf" transform="translate(700 596) rotate(-10) scale(1.1)"/>
    <use href="#leaf" transform="translate(1042 578) rotate(14) scale(1.15)"/>
  </g>
</svg>
