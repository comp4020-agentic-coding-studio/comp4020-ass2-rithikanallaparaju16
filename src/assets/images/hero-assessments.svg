<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <!-- Assessment: one student, a long way into an empty field, notebook open,
       not writing yet. The composition is nearly all negative space on
       purpose — every deadline in this course is placed so that the person
       doing the work has room around them. The open ring overhead is the same
       motif as the homepage, drawn faint: the thought that hasn't closed. -->
  <defs>
    <linearGradient id="asSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14110e"/>
      <stop offset="0.7" stop-color="#1e170f"/>
      <stop offset="1" stop-color="#2a2014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b97d1c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b97d1c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#asSky)"/>

  <!-- a low sun's worth of light, nothing more -->
  <ellipse cx="1180" cy="300" rx="440" ry="300" fill="url(#glow)"/>

  <!-- the unclosed ring, high and faint -->
  <path d="M1268 108a96 96 0 1 1-52 177" fill="none" stroke="#b97d1c" stroke-width="10"
        stroke-linecap="round" opacity="0.3"/>

  <!-- horizon: a long shallow rise, two plates -->
  <path d="M0 520c340-30 680-16 1010 4s250 24 590-8v184H0Z" fill="#8a5c13" opacity="0.42"/>
  <path d="M0 538c340-30 680-16 1010 4s250 24 590-8v166H0Z" fill="#b97d1c" opacity="0.24"/>

  <!-- three sparse tufts, so the field has a scale -->
  <g stroke="#14110e" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <path d="M244 566c4-16 2-26-4-34M256 566c8-14 12-24 10-34"/>
    <path d="M1348 590c4-16 2-26-4-34M1360 590c8-14 12-24 10-34"/>
    <path d="M980 604c4-14 2-24-4-30"/>
  </g>

  <!-- The student, off-centre and cross-legged. Scaled up from a first pass
       where the figure was too small to read as a person at all — the empty
       field only means something if you can see who is sitting in it. -->
  <g transform="translate(902 330) scale(1.55)">
    <!-- out-of-register gold behind -->
    <g style="mix-blend-mode:screen" opacity="0.45" transform="translate(7 -6)">
      <circle cx="0" cy="0" r="31" fill="#b97d1c"/>
      <path d="M-46 116c0-38 21-66 46-66s46 28 46 66Z" fill="#b97d1c"/>
    </g>
    <!-- head tipped back a little: thinking, not writing -->
    <circle cx="0" cy="-2" r="30" fill="#f3ece0"/>
    <path d="M-45 116c0-37 20-64 45-64s45 27 45 64Z" fill="#14110e"/>
    <!-- crossed legs as one flat wedge -->
    <path d="M-72 116h144c0 12-32 20-72 20s-72-8-72-20Z" fill="#14110e"/>
    <!-- eyes closed, mouth neutral. Nobody looks clever while thinking. -->
    <path d="M-16 -6c4-5 11-5 15 0M1 -6c4-5 11-5 15 0" stroke="#16120f" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M-8 14h16" stroke="#16120f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- The notebook, open and untouched. Two facing pages tilted up as a
         shallow V, which reads as a book at a glance where a flat sliver
         didn't. -->
    <g transform="translate(0 100)">
      <path d="M-46 12 -3 2 -3 16Z" fill="#f3ece0" opacity="0.95"/>
      <path d="M46 12 3 2 3 16Z" fill="#efe7d8" opacity="0.95"/>
      <g stroke="#6b6154" stroke-width="2" opacity="0.55">
        <path d="M-38 10h26M-34 14h20"/>
        <path d="M12 10h26M14 14h20"/>
      </g>
    </g>
  </g>

  <!-- a pen, put down beside them -->
  <g transform="translate(1028 520) rotate(-16)" opacity="0.75">
    <rect x="0" y="0" width="58" height="8" rx="4" fill="#b97d1c"/>
  </g>
</svg>
