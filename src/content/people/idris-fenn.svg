<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
  <!-- Second in the two-ink portrait series: same two plates and the same
       out-of-register offset. Told apart at card size by a side parting and a
       squarer jaw rather than by any facial detail, which at this scale turns
       to mud. -->
  <rect width="400" height="400" fill="#f3ece0"/>

  <!-- gold plate, offset the other way so the series doesn't look mechanical -->
  <g style="mix-blend-mode:multiply" transform="translate(-4 4)" fill="#8a5c13" opacity="0.9">
    <path d="M54 400c0-60 44-102 100-114 22-5 68-5 90 0 56 12 100 54 100 114Z"/>
    <!-- one head silhouette only: the rim of gold escaping the dark plate IS
         the misregistration. A second gold shape reads as a stain. -->
    <path d="M200 82c41 0 72 28 72 68 0 30-10 54-26 68-13 11-29 16-46 16s-33-5-46-16c-16-14-26-38-26-68 0-40 31-68 72-68Z"/>
  </g>

  <g fill="#1a1613">
    <path d="M58 400c0-58 43-100 97-112 22-4 68-4 90 0 54 12 97 54 97 112Z" opacity="0.92"/>
    <!-- open collar, a V rather than a notch -->
    <path d="M168 286c11 20 21 30 32 30s21-10 32-30c-10-5-21-7-32-7s-22 2-32 7Z" fill="#f3ece0"/>
  </g>

  <!-- squarer face: flatter jaw than the other two -->
  <path d="M200 82c41 0 72 28 72 68 0 30-10 54-26 68-13 11-29 16-46 16s-33-5-46-16c-16-14-26-38-26-68 0-40 31-68 72-68Z" fill="#f6f1e7"/>
  <!-- close crop with a side parting on the left -->
  <path d="M200 78c45 0 75 30 75 70 0 7-2 12-5 12-4 0-3-15-10-25-8-11-22-18-42-20-14-2-28 0-40 5-11 4-19 11-23 19-6 12-4 21-8 21-3 0-5-5-5-12 0-40 13-70 58-70Z" fill="#1a1613"/>

  <!-- eyes: calm, closed -->
  <path d="M160 166c7-8 19-8 26 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M214 166c7-8 19-8 26 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M156 146c9-4 23-4 31-1" stroke="#1a1613" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M213 145c8-3 22-3 31 1" stroke="#1a1613" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- smile, slightly wider than the others -->
  <path d="M176 202c9 10 39 10 48 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="150" cy="188" rx="12" ry="7" fill="#b97d1c" opacity="0.3"/>
  <ellipse cx="250" cy="188" rx="12" ry="7" fill="#b97d1c" opacity="0.3"/>
</svg>
