<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
  <!-- Two-ink risograph portrait: one gold plate, one near-black plate, printed
       slightly out of register on warm cream. The offset gold group is the
       misregistration; it is the whole reason these look printed rather than
       drawn. -->
  <rect width="400" height="400" fill="#f3ece0"/>

  <!-- gold plate, offset down-right, multiplied so overlaps darken -->
  <g style="mix-blend-mode:multiply" transform="translate(5 4)" fill="#b97d1c" opacity="0.9">
    <path d="M56 400c0-62 44-104 100-116 22-5 66-5 88 0 56 12 100 54 100 116Z"/>
    <ellipse cx="200" cy="168" rx="80" ry="94"/>
    <path d="M200 62c50 0 82 34 82 82 0 14-3 25-7 25-6 0-4-24-14-38-12-16-33-22-61-22s-49 6-61 22c-10 14-8 38-14 38-4 0-7-11-7-25 0-48 32-82 82-82Z"/>
  </g>

  <!-- dark plate -->
  <g fill="#1a1613">
    <!-- shoulders -->
    <path d="M60 400c0-60 42-101 97-113 21-4 65-4 86 0 55 12 97 53 97 113Z" opacity="0.92"/>
    <!-- collar notch, so the torso reads as clothing -->
    <path d="M172 288c9 16 19 24 28 24s19-8 28-24c-9-4-19-6-28-6s-19 2-28 6Z" fill="#f3ece0"/>
  </g>

  <!-- face, sitting on top of both plates -->
  <ellipse cx="200" cy="166" rx="76" ry="90" fill="#f6f1e7"/>
  <!-- hair mass: a high wrap, left side heavier -->
  <path d="M200 60c52 0 84 36 84 84 0 10-2 18-6 18-5 0-3-22-13-35-11-15-32-21-59-21-14 0-27 2-37 7-13 6-21 15-25 26-6 15-3 34-9 34-5 0-7-10-7-22 0-51 30-91 72-91Z" fill="#1a1613"/>
  <!-- one lock falling past the temple, kept thin so it reads as hair -->
  <path d="M128 148c-7 18-8 40-4 58 1 5-4 7-6 2-8-17-9-44-3-62 2-6 8-8 12-6 2 1 2 5 1 8Z" fill="#1a1613"/>

  <!-- calm, closed eyes: soft downward arcs read as rested, not shut tight -->
  <path d="M162 162c6-7 18-7 24 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M214 162c6-7 18-7 24 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- brows, level and unworried -->
  <path d="M158 142c8-5 22-5 30-2" stroke="#1a1613" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M212 140c8-3 22-3 30 2" stroke="#1a1613" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- the smile: shallow, closed, unhurried -->
  <path d="M178 200c8 9 36 9 44 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- a single warm cheek block from the gold plate -->
  <ellipse cx="152" cy="186" rx="13" ry="8" fill="#b97d1c" opacity="0.35"/>
  <ellipse cx="248" cy="186" rx="13" ry="8" fill="#b97d1c" opacity="0.35"/>
</svg>
