<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <!-- Homepage banner. The starter artwork was a lecture theatre, which this
       course specifically refuses to teach in, so it is replaced with the
       thing the course actually does: people sitting on grass, outdoors, doing
       nothing in particular. Kept dark because the page title overlays it.
       The open ring at the right is the course's argument in one shape — a
       loop that never closes. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14110e"/>
      <stop offset="1" stop-color="#221b13"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- the unclosed loop: one stroke, deliberately short of meeting itself -->
  <g style="mix-blend-mode:screen" opacity="0.55">
    <path d="M1332 168a118 118 0 1 1-64 217" fill="none" stroke="#b97d1c" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- tree canopies, flat masses in two weights -->
  <g fill="#8a5c13" opacity="0.55">
    <ellipse cx="196" cy="252" rx="150" ry="106"/>
    <ellipse cx="352" cy="288" rx="104" ry="76"/>
  </g>
  <g fill="#b97d1c" opacity="0.4" style="mix-blend-mode:screen" transform="translate(10 -8)">
    <ellipse cx="196" cy="252" rx="150" ry="106"/>
  </g>
  <rect x="186" y="330" width="18" height="150" fill="#6b6154" opacity="0.7"/>
  <rect x="344" y="352" width="13" height="120" fill="#6b6154" opacity="0.55"/>

  <!-- the grass: two overlapping ink plates, out of register -->
  <path d="M0 486c260-42 520-30 800-6s540 34 800-6v226H0Z" fill="#8a5c13" opacity="0.5"/>
  <path d="M0 500c260-42 520-30 800-6s540 34 800-6v212H0Z" fill="#b97d1c" opacity="0.32"/>

  <!-- seated figures: a head circle and a rounded body, nothing more. Spaced
       unevenly so the row reads as people rather than as a diagram. -->
  <g fill="#14110e">
    <g transform="translate(640 402)">
      <circle cx="0" cy="0" r="27"/><path d="M-40 96c0-33 18-58 40-58s40 25 40 58Z"/>
    </g>
    <g transform="translate(742 420)">
      <circle cx="0" cy="0" r="25"/><path d="M-37 90c0-31 17-54 37-54s37 23 37 54Z"/>
    </g>
    <g transform="translate(866 408)">
      <circle cx="0" cy="0" r="28"/><path d="M-42 98c0-34 19-60 42-60s42 26 42 60Z"/>
    </g>
    <g transform="translate(1010 424)">
      <circle cx="0" cy="0" r="24"/><path d="M-36 88c0-30 16-52 36-52s36 22 36 52Z"/>
    </g>
    <g transform="translate(1118 414)">
      <circle cx="0" cy="0" r="26"/><path d="M-39 94c0-32 17-56 39-56s39 24 39 56Z"/>
    </g>
  </g>

  <!-- one figure a little apart from the group, facing the same way. Somebody
       always sits slightly off. -->
  <g fill="#14110e" transform="translate(1268 430)">
    <circle cx="0" cy="0" r="23"/><path d="M-34 86c0-29 15-50 34-50s34 21 34 50Z"/>
  </g>
</svg>
