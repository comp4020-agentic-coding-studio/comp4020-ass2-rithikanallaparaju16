<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
  <!-- Third in the series. Long hair drawn as one continuous mass behind the
       head rather than as separate side pieces, which at card size read as
       floating bars. The plates sit closer to register here, so this one is a
       little quieter than the other two — fitting for the only visitor. -->
  <rect width="400" height="400" fill="#f3ece0"/>

  <g style="mix-blend-mode:multiply" transform="translate(4 4)" fill="#b97d1c" opacity="0.85">
    <path d="M52 400c0-58 42-100 98-112 24-5 76-5 100 0 56 12 98 54 98 112Z"/>
    <!-- traced from the dark hair mass below, not drawn larger: the gold should
         escape as a rim on two sides, not surround the head. -->
    <path d="M200 58c52 0 84 36 84 88 0 50-8 96-18 96-7 0-4-50-12-74-4-13-10-22-18-28l-36 2c-8 6-14 15-18 28-8 24-5 74-12 74-10 0-18-46-18-96 0-52 32-90 84-90Z"/>
  </g>

  <!-- hair mass: crown plus both falls, one path so it cannot detach -->
  <path d="M200 58c52 0 84 36 84 88 0 50-8 96-18 96-7 0-4-50-12-74-4-13-10-22-18-28l-36 2c-8 6-14 15-18 28-8 24-5 74-12 74-10 0-18-46-18-96 0-52 32-90 84-90Z" fill="#1a1613"/>

  <g fill="#1a1613">
    <path d="M56 400c0-56 42-98 97-110 24-4 74-4 98 0 54 12 96 54 96 110Z" opacity="0.92"/>
    <path d="M174 290c8 18 17 26 26 26s18-8 26-26c-8-4-17-6-26-6s-18 2-26 6Z" fill="#f3ece0"/>
  </g>

  <ellipse cx="200" cy="166" rx="72" ry="86" fill="#f6f1e7"/>
  <!-- fringe and centre parting, sitting over the face edge -->
  <path d="M200 80c46 0 74 30 74 66 0 8-3 13-7 13-4 0-2-19-11-31-8-11-21-18-38-20l-18 2-18-2c-17 2-30 9-38 20-9 12-7 31-11 31-4 0-7-5-7-13 0-36 28-66 74-66Z" fill="#1a1613"/>

  <!-- eyes closed, the calmest of the three -->
  <path d="M161 164c7-7 19-7 26 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M213 164c7-7 19-7 26 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M157 144c9-4 23-4 31-1" stroke="#1a1613" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M212 143c8-3 22-3 31 1" stroke="#1a1613" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- the shallowest smile in the set -->
  <path d="M181 200c7 7 31 7 38 0" stroke="#1a1613" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="152" cy="186" rx="12" ry="7" fill="#b97d1c" opacity="0.32"/>
  <ellipse cx="248" cy="186" rx="12" ry="7" fill="#b97d1c" opacity="0.32"/>
</svg>
