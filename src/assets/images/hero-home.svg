<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1810 768" width="1810" height="768" role="img">
  <!-- Homepage: a lecture theatre seen straight down the central aisle, two
       banks of tiered seats receding toward tall windows at the back.

       This is an homage to the starter's banner rather than the starter's
       banner. That file is hash-checked by `pnpm check:evidence` as template
       placeholder, so shipping it — under any filename — would mean passing
       somebody else's illustration off as our own. The composition, the
       palette and the two-ink treatment follow it; every path here is drawn.

       Sized 1810x768 to match the rest of the hero set after padding, which
       is close to the ratio the starter used and crops cleanly in this
       theme. -->
  <defs>
    <!-- One seat in three-quarter view, reused down each row and scaled per
         rank so the rows recede without anything being redrawn. -->
    <g id="seat">
      <path d="M0 0h58c6 0 10 4 10 10v46c0 6-4 10-10 10H0Z" fill="#1a1613"/>
      <path d="M4 4h50c5 0 8 3 8 8v40c0 5-3 8-8 8H4Z" fill="#d8ab4e"/>
      <path d="M0 66h74c5 0 8 3 8 8v10c0 5-3 8-8 8H0Z" fill="#1a1613"/>
      <path d="M6 70h62c4 0 6 2 6 6v4c0 4-2 6-6 6H6Z" fill="#c9a24a"/>
      <rect x="18" y="92" width="12" height="26" fill="#1a1613"/>
    </g>
    <!-- Four ranks of four seats: one bank, so the mirrored side is a
         transform of exactly the same geometry. -->
    <g id="bank">
      <g fill="#1a1613" opacity="0.9">
        <path d="M0 700h700l-60 68H0Z"/><path d="M0 600h620l-52 60H0Z"/>
        <path d="M40 522h548l-44 52H40Z"/><path d="M140 458h480l-36 44H140Z"/>
      </g>
      <g transform="translate(-150 586) scale(1.55)">
        <use href="#seat"/><use href="#seat" x="92"/><use href="#seat" x="184"/>
        <use href="#seat" x="276"/><use href="#seat" x="368"/><use href="#seat" x="460"/>
      </g>
      <g transform="translate(-60 496) scale(1.3)">
        <use href="#seat"/><use href="#seat" x="92"/><use href="#seat" x="184"/>
        <use href="#seat" x="276"/><use href="#seat" x="368"/><use href="#seat" x="460"/>
      </g>
      <g transform="translate(40 424) scale(1.08)">
        <use href="#seat"/><use href="#seat" x="92"/><use href="#seat" x="184"/>
        <use href="#seat" x="276"/><use href="#seat" x="368"/><use href="#seat" x="460"/>
      </g>
      <g transform="translate(140 366) scale(0.88)">
        <use href="#seat"/><use href="#seat" x="92"/><use href="#seat" x="184"/>
        <use href="#seat" x="276"/><use href="#seat" x="368"/><use href="#seat" x="460"/>
      </g>
    </g>
  </defs>

  <rect width="1810" height="768" fill="#f2eee3"/>

  <!-- back wall, gold, with the windows cut into it -->
  <rect x="0" y="0" width="1810" height="444" fill="#c9a24a"/>
  <rect x="0" y="0" width="1810" height="34" fill="#1a1613" opacity="0.9"/>

  <!-- Back wall: tall windows with gold mullions and cream glass. The centre
       window is taller and sits on the aisle's vanishing point. -->
  <rect x="596" y="52" width="618" height="392" fill="#c9a24a"/>
  <rect x="812" y="26" width="186" height="418" fill="#c9a24a"/>
  <g fill="#f7f3e8">
    <rect x="624" y="80" width="72" height="336"/><rect x="716" y="80" width="72" height="336"/>
    <rect x="836" y="56" width="66" height="360"/><rect x="908" y="56" width="66" height="360"/>
    <rect x="1022" y="80" width="72" height="336"/><rect x="1114" y="80" width="72" height="336"/>
  </g>
  <g stroke="#1a1613" stroke-width="9">
    <path d="M660 80v336M752 80v336M869 56v360M941 56v360M1058 80v336M1150 80v336"/>
    <path d="M624 214h164M836 190h138M1022 214h164"/>
  </g>
  <g fill="none" stroke="#1a1613" stroke-width="11">
    <rect x="624" y="80" width="164" height="336"/><rect x="836" y="56" width="138" height="360"/>
    <rect x="1022" y="80" width="164" height="336"/>
  </g>
  <!-- light thrown out of the windows onto the wall below them -->
  <g fill="#d8ab4e" opacity="0.5">
    <path d="M788 416l84-96v96ZM974 416l84-96v96Z"/>
  </g>

  <!-- Floor, then the aisle widening toward the viewer. Cream, so the eye
       runs straight down it to the windows. -->
  <rect x="0" y="444" width="1810" height="324" fill="#f2eee3"/>
  <path d="M760 444h290l318 324H442Z" fill="#f7f3e8"/>

  <use href="#bank"/>
  <use href="#bank" transform="translate(1810 0) scale(-1 1)"/>

  <!-- The room is empty, which is the point: this course does not teach here.
       One seat folded down on the aisle is the only sign anyone came. -->
  <g transform="translate(470 636) scale(1.1)">
    <path d="M0 66h74c5 0 8 3 8 8v10c0 5-3 8-8 8H0Z" fill="#1a1613"/>
    <path d="M6 70h62c4 0 6 2 6 6v4c0 4-2 6-6 6H6Z" fill="#d8ab4e"/>
    <rect x="18" y="92" width="12" height="26" fill="#1a1613"/>
  </g>
</svg>
